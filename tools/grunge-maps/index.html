<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grunge Maps by FlorindoLAB</title>
<meta name="description" content="Générateur gratuit de grunge maps dans le navigateur : rayures, poussière, rouille, fissures, déformations et lens dirt, exportés en maps PBR et PNG 16 bits pour les logiciels 3D.">
<meta property="og:title" content="Grunge Maps by FlorindoLAB">
<meta property="og:description" content="Générateur gratuit de grunge maps : imperfections de surface, déformations et lens dirt, directement dans le navigateur.">
<meta property="og:image" content="img/logo-512.png">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="icon" href="img/logo-512.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="#192833" stroke="#33495b"/><path d="M6 25.5 L19 9" stroke="#d9a441" stroke-width="2.4" stroke-linecap="round"/><path d="M12 26 L24.5 11" stroke="#d9a441" stroke-width="1.3" stroke-linecap="round" opacity=".75"/><path d="M19.5 26 L26 18.5" stroke="#d9a441" stroke-width="0.9" stroke-linecap="round" opacity=".55"/><circle cx="9" cy="9" r="1.6" fill="#ebe7df"/><circle cx="13.5" cy="6.5" r="0.9" fill="#ebe7df" opacity=".7"/><circle cx="6.5" cy="14" r="0.8" fill="#ebe7df" opacity=".6"/><circle cx="24" cy="24.5" r="1.1" fill="#ebe7df" opacity=".5"/></svg>
      <div class="brand-t"><b>Grunge Maps <span class="beta" title="Version bêta : tes retours sont les bienvenus">BÊTA</span></b><small>by <span class="fl">Florindo</span><span class="lab">LAB</span></small></div>
    </div>
    <nav class="modules" id="modTabs" role="tablist" aria-label="Modules"></nav>
    <div class="seg mode" id="modeSeg" role="group" aria-label="Mode d'interface">
      <button data-mode="express">Express</button><button data-mode="advanced">Avancé</button>
    </div>
    <div class="seg lang" id="langSeg" role="group" aria-label="Langue"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <div class="actions">
      <button id="undoBtn" class="icon" title="Annuler (Ctrl+Z)" aria-label="Annuler"></button>
      <button id="redoBtn" class="icon" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir"></button>
      <div class="menu">
        <button id="projBtn" class="ghost">Projet</button>
        <div class="menu-pop" id="projMenu" hidden>
          <button data-a="new">Nouveau projet</button>
          <button data-a="open">Ouvrir un projet…</button>
          <button data-a="save">Enregistrer le projet (.json)</button>
          <hr>
          <button data-a="preset">Enregistrer comme preset</button>
          <button data-a="clear">Vider le module courant</button>
        </div>
      </div>
      <button id="aboutBtn" class="ghost" title="À propos, retours et licences">À propos</button>
      <button id="exportBtn" class="primary">Exporter</button>
    </div>
  </header>
  <main class="work">
    <aside class="left panel" id="left" aria-label="Presets et couches"></aside>
    <section class="stage" aria-label="Prévisualisation">
      <div class="stage-bar" id="stageBar"></div>
      <div class="viewport" id="viewport">
        <canvas id="c2d"></canvas>
        <div id="three" hidden></div>
        <div class="cmp" id="cmpHandle" hidden><span>Avant</span><span>Après</span></div>
        <div class="busy" id="busy" hidden><span></span>Calcul…</div>
      </div>
      <div class="status" id="status"></div>
    </section>
    <aside class="right panel" id="right" aria-label="Réglages"></aside>
  </main>
</div>
<div class="modal" id="exportModal" hidden><div class="mcard" id="exportCard" role="dialog" aria-modal="true" aria-labelledby="expTitle"></div></div>
<div class="modal" id="promptModal" hidden><div class="mcard small" id="promptCard" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="aboutModal" hidden><div class="mcard" id="aboutCard" role="dialog" aria-modal="true" aria-labelledby="aboutTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileProject" accept=".json,application/json" hidden>
<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileModel" accept=".glb,.gltf,.obj,.fbx" hidden>
<input type="file" id="fileHdri" accept=".hdr,.exr,image/jpeg,image/png" hidden>

<script src="js/vendor/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="js/vendor/jszip.min.js"></script>
<script id="core-src" src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
