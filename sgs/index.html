<style>
:root{--bg:#101a21;--panel:#17242d;--line:#2C3D49;--ink:#E8EDF0;--muted:#8FA0AC;--gold:#d9a441;--err:#E07A5F}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:380px;background:var(--panel);border-radius:14px;padding:26px 22px 20px;box-shadow:0 0 0 3px var(--line)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:24px;margin:0 0 4px}
.by{font-size:13px;color:var(--muted);margin:0 0 20px}.by b{color:var(--gold);font-weight:600}
label{display:block;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;min-height:46px;border-radius:9px;border:1px solid var(--line);background:#0c151b;color:var(--ink);padding:0 12px;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
button{width:100%;min-height:46px;border:0;border-radius:9px;background:var(--gold);color:#101a21;font-weight:600;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:22px;font-size:14px;margin:12px 0 0;color:var(--err)}
</style>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent), KEY='sgs-access', en=!/^fr\b/i.test(navigator.language||'fr');
  var lang=null; try{ lang=localStorage.getItem('sgs-lang'); }catch(e){} if (lang) en = lang==='en';
  var T = en ? { pw:'Password', rem:'Remember me on this device', go:'Unlock', bad:'Wrong password.', wait:'Unlocking…', old:'This browser is too old to open the app.' }
             : { pw:'Mot de passe', rem:'Se souvenir de moi sur cet appareil', go:'Déverrouiller', bad:'Mot de passe incorrect.', wait:'Déverrouillage…', old:'Ce navigateur est trop ancien pour ouvrir l’appli.' };
  if (en){ document.documentElement.lang='en'; document.getElementById('lpw').textContent=T.pw; document.getElementById('lrem').textContent=T.rem; document.getElementById('go').textContent=T.go; }
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  function u8(b){ var s=atob(b), u=new Uint8Array(s.length); for (var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
  function b64(u){ var s=''; for (var i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s); }
  if (!window.crypto || !crypto.subtle){ msg.textContent=T.old; go.disabled=true; return; }
  async function open(key){
    var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.data));
    var html=new TextDecoder().decode(pt);
    window.sgsLogout=function(){ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); };
    document.open(); document.write(html); document.close();
  }
  async function fromPassword(pw){
    var base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
  }
  (async function(){ if (document.readyState==='loading') await new Promise(function(r){ document.addEventListener('DOMContentLoaded', r); }); var s=null; try{ s=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    if (s && s.salt===P.salt){ try{ var k=await crypto.subtle.importKey('raw', u8(s.key), 'AES-GCM', false, ['decrypt']); await open(k); return; }catch(e){ try{ localStorage.removeItem(KEY); }catch(_){} } }
  })();
  document.getElementById('f').addEventListener('submit', async function(e){ e.preventDefault(); msg.textContent=''; go.disabled=true; go.textContent=T.wait;
    try{ var k=await fromPassword(document.getElementById('pw').value), raw=new Uint8Array(await crypto.subtle.exportKey('raw', k));
      var ok=false; try{ await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, k, u8(P.data)); ok=true; }catch(_){}
      if (!ok){ msg.textContent=T.bad; go.disabled=false; go.textContent=T.go; document.getElementById('pw').select(); return; }
      if (document.getElementById('rem').checked){ try{ localStorage.setItem(KEY, JSON.stringify({salt:P.salt, key:b64(raw)})); }catch(_){} }
      await open(k);
    }catch(err){ msg.textContent=T.bad; go.disabled=false; go.textContent=T.go; }
  });
})();
</script>
