          - {label: "load_error", name: load_error, widget: string}
          - {label: "p_web", name: p_web, widget: string}
          - {label: "p_dctl", name: p_dctl, widget: string}
          - {label: "p_android", name: p_android, widget: string}
          - {label: "p_windows", name: p_windows, widget: string}
          - {label: "Page Soutenir : titre", name: support_title, widget: string}
          - {label: "Page Soutenir : texte", name: support_text, widget: text}
          - {label: "Bouton de don", name: coffee, widget: string}
          - {label: "Pied de page", name: footer, widget: string}
          - {label: "nav_license", name: nav_license, widget: string}
          - {label: "Licence : titre", name: license_title, widget: string}
          - {label: "Licence : introduction", name: license_lead, widget: text}
          - {label: "Lien vers la licence (fiches d'outils)", name: license_link, widget: string}
          - {label: "Badge Nouveau", name: new, widget: string}
          - {label: "Titre du bloc À la une", name: featured, widget: string}
          - {label: "Pop-up de téléchargement : titre", name: thanks_title, widget: string}
          - {label: "Pop-up de téléchargement : message", name: thanks_text, widget: text}
